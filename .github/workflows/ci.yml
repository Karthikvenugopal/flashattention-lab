name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,bench]'
      - run: python -m pytest --cpu-only -q -rs
      - run: python scripts/audit_results.py
      - run: python -m attention_lab tiny
      - run: python examples/tiny.py
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
